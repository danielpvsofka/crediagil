[project]
name = "crediagil"
version = "0.1.0"
description = "Agente de originación de crédito de libre inversión para Crediágil (fintech ficticia)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "mcp>=2.3,<3", "filelock", "claude-agent-sdk>=0.2.168,<0.3", "anyio>=4", "python-dotenv", "starlette", "uvicorn"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = [".claude/hooks", "src"]
pythonpath = ["src"]
markers = ["live: pruebas con el modelo real; consumen saldo y requieren ANTHROPIC_API_KEY"]
addopts = "-m 'not live'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crediagil"]
